# Global mise config — managed by ~/.dotfiles, symlinked by install-minimal.sh
# to ~/.config/mise/config.toml. Add new mise-managed tools here rather than
# hand-rolling another curl+tar block in install-minimal.sh.
[settings]
experimental = false

[tools]
jq = "latest"
"7zip" = "latest"
fd = "latest"
ripgrep = "latest"
zoxide = "latest"
bat = "latest"
eza = "latest"
lazygit = "latest"
lazydocker = "latest"
zellij = "latest"
fzf = "latest"
# bin_path selects the musl build baked into broot's single multi-platform
# zip release; the registry default resolves the glibc build, which needs
# GLIBC >= 2.29 and doesn't run on Rocky Linux 8 (GLIBC 2.28).
broot = { version = "latest", bin_path = "x86_64-unknown-linux-musl" }
gdu = "latest"
# asset_pattern pins the musl release asset; lstr's default gnu build also
# needs GLIBC >= 2.29 and doesn't run on Rocky Linux 8 (GLIBC 2.28).
"github:bgreenwell/lstr" = { version = "latest", asset_pattern = "lstr-x86_64-unknown-linux-musl.tar.xz" }
"github:quantumsheep/sshs" = { version = "latest", asset_pattern = "sshs-linux-amd64-musl", bin = "sshs" }
# The space inside {{ version }} is deliberate: mise's legacy-template
# deprecation check does a naive substring match for `{version}`, which
# false-positives on the tight `{{version}}` form (it's a literal substring
# of it) even though that's valid Tera syntax. The spaced form resolves
# identically and avoids the spurious "deprecated legacy-version-template"
# warning on every install/upgrade.
"github:dandavison/delta" = { version = "latest", asset_pattern = "delta-{{ version }}-x86_64-unknown-linux-musl.tar.gz" }
"github:neovim/neovim-releases" = { version = "latest", asset_pattern = "nvim-linux-x86_64.tar.gz" }
node = "23"
